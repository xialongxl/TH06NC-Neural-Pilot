[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "th06nc-neural-pilot"
version = "0.1.0"
description = "Read-only TH06NC reinforcement learning with an independent fail-closed GPU watchdog"
readme = "README.md"
authors = [{name = "夏龙xl (xialongxl)"}]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pillow>=10", "mss>=10", "pefile>=2024.8.26", "capstone>=5", "nvidia-ml-py>=13.580", "fastapi==0.162.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
train = ["torch>=2.6", "gymnasium>=1.0", "stable-baselines3>=2.6", "tensorboard>=2.18"]
test = ["pytest>=8", "httpx2==2.14.0"]

[project.scripts]
th06ai = "th06ai.__main__:main"

[project.urls]
Repository = "https://github.com/xialongxl/TH06NC-Neural-Pilot"
Issues = "https://github.com/xialongxl/TH06NC-Neural-Pilot/issues"

[tool.setuptools.packages.find]
include = ["th06ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
